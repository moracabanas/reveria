name: Frontend Evaluation

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-eval.yml'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@a81bbbf8298c0fa03ea29cdc473d45769f953675

      - uses: actions/setup-node@e331126f8e82f9994c3ab644b9c1e1c5a5f6abd9
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Run unit tests
        run: npm run test:run

      - name: Upload coverage
        uses: actions/upload-artifact@9ebc9b000f2e0fd3e2c5a6e6f6f7f0f9d7b5c6a8
        with:
          name: coverage
          path: coverage/

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@a81bbbf8298c0fa03ea29cdc473d45769f953675

      - uses: actions/setup-node@e331126f8e82f9994c3ab644b9c1e1c5a5f6abd9
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
